services:
  gpu-cluster-simulator:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../candidate/simulators:/app
      - ../candidate/data:/data:ro
    command: sh -c "pip install --no-cache-dir fastapi uvicorn >/tmp/gpu-sim-install.log 2>&1 && uvicorn cluster_simulator:app --host 0.0.0.0 --port 8090"
    ports:
      - "8190:8090"
    environment:
      CLUSTER_DATA_DIR: /data
